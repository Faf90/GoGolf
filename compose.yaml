services:
  api:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  web:
    build: ./frontend

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sysadmin
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: gogolf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  proxy:
    image: caddy:alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - web

volumes:
  pgdata: